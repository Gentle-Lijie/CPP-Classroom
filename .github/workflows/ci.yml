name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://classroom:ci-only-password@127.0.0.1:5432/classroom
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - name: Start native PostgreSQL
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE classroom LOGIN PASSWORD 'ci-only-password';"
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c 'CREATE DATABASE classroom OWNER classroom;'
      - run: pnpm db:migrate
      - name: Verify persistent queue and database writes
        run: |
          pnpm --filter @classroom/worker start > /tmp/cpp-classroom-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          pnpm queue:probe || { cat /tmp/cpp-classroom-worker.log; exit 1; }
